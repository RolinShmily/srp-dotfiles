# Minimal tmux configuration: keeps all default keybindings (Ctrl+b prefix)
# and tmux CLI behavior intact while setting sensible terminal defaults.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g mouse on
set -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# 避免 SSH 网络延迟下 OSC 10/11 颜色响应与转义序列分包泄漏为键盘字符
set -sg escape-time 150
