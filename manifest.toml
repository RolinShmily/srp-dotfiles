# manifest.toml - SrP-Dotfiles 跨平台依赖与配置清单

[arch]
package_manager = "pacman"
packages = [
    # Shell 环境
    "zsh", "zsh-autosuggestions", "zsh-syntax-highlighting",
    # CLI 现代增强
    "eza", "zoxide", "fzf", "bat", "fd", "ripgrep", "diff-so-fancy", "github-cli", "lazygit", "jq", "tldr",
    # 语言与运行时
    "nodejs", "npm", "python", "uv",
    # 文件管理 (Yazi 及其预览插件依赖) 与音频录制
    "yazi", "file", "chafa", "imagemagick", "poppler", "ffmpeg", "sox", "7zip", "unarchiver", "perl-image-exiftool", "mediainfo", "zathura", "zathura-pdf-poppler", "miller", "resvg", "xdg-utils", "xclip", "wl-clipboard",
    # 编辑器与编译基础
    "vim", "git", "base-devel", "gcc", "unzip",
    # 终端复用
    "zellij",
    # 监控与信息展示
    "fastfetch", "btop"
]
npm_globals = [
    "@earendil-works/pi-coding-agent",
    "@antfu/ni",
    "live-server"
]
configs = [
    "btop",
    "fastfetch",
    "yazi",
    "zellij",
    "pi"
]
zsh_module = "arch"
pi_extensions = [
    "srp-ask.ts",
    "srp-continue.ts",
    "srp-prompt.ts",
    "srp-providers.ts",
    "srp-theme.ts",
    "srp-vision.ts",
    "srp-voice.ts",
    "srp-image.ts",
    "srp-web.ts",
    "wsl-screenshot.ts",
    "srp-memory",
    "srp-subagent"
]
pi_packages = [
    "npm:@narumitw/pi-goal",
    "npm:@ff-labs/pi-fff",
    "npm:@upstash/context7-pi",
    "npm:@narumitw/pi-btw",
    "npm:pi-antigravity",
    "npm:pi-autoresearch",
    "npm:pi-wakatime"
]
skills_add = []

[debian]
package_manager = "apt"
packages = [
    # Shell 环境
    "zsh", "zsh-autosuggestions", "zsh-syntax-highlighting",
    # CLI 现代增强
    "eza", "zoxide", "fzf", "bat", "fd-find", "ripgrep", "gh", "lazygit", "jq", "tealdeer",
    # 语言与运行时
    "nodejs", "python3", "python3-pip", "python3-venv",
    # 编辑器与基础开发
    "vim", "git", "build-essential", "gcc", "unzip",
    # 监控与系统
    "fastfetch", "btop"
]
npm_globals = [
    "@earendil-works/pi-coding-agent",
    "@agegr/pi-web@latest",
    "skills"
]
configs = [
    "btop",
    "fastfetch",
    "pi",
]
zsh_module = "debian"
pi_extensions = [
    "srp-ask.ts",
    "srp-continue.ts",
    "srp-prompt.ts",
    "srp-providers.ts",
    "srp-theme.ts",
    "srp-vision.ts",
    "srp-image.ts",
    "srp-memory"
]
pi_packages = [
    "npm:pi-web-access",
    "npm:pi-mcp-adapter",
    "npm:pi-subagents",
    "npm:pi-background-tasks",
    "npm:@xjuai/pi-feishu-lark",
    "npm:pi-memory",
    "npm:pi-antigravity",
    "npm:context-mode",
    "npm:pi-wakatime"
]
skills_add = [
    "mvanhorn/last30days-skill",
    "K-Dense-AI/scientific-agent-skills",
    "https://github.com/WEIFENG2333/VideoCaptioner/",
    "https://github.com/Leonxlnx/taste-skill",
    "tt-a1i/archify",
    "https://github.com/Panniantong/agent-reach"
]

[termux]
package_manager = "pkg"
packages = [
    # Shell 环境
    "zsh",
    # CLI 现代增强
    "eza", "zoxide", "fzf", "bat", "fd", "ripgrep", "diff-so-fancy", "gh", "lazygit", "jq", "tealdeer",
    # 语言与运行时
    "nodejs", "python", "uv",
    # 文件管理 (Yazi)
    "yazi", "file", "chafa", "imagemagick", "poppler", "ffmpeg", "7zip", "unar", "exiftool", "mediainfo", "miller",
    # 基础开发
    "git", "clang", "make", "unzip", "tree-sitter",
    # 终端复用与监控
    "zellij", "fastfetch", "htop", "termux-api"
]
npm_globals = [
    "@earendil-works/pi-coding-agent",
    "@antfu/ni",
    "live-server"
]
configs = [
    "fastfetch",
    "yazi",
    "zellij",
    "pi"
]
zsh_module = "termux"
pi_extensions = [
    "srp-ask.ts",
    "srp-continue.ts",
    "srp-prompt.ts",
    "srp-providers.ts",
    "srp-theme.ts",
    "srp-vision.ts",
    "srp-image.ts",
    "srp-web.ts",
    "srp-memory",
    "srp-subagent"
]
pi_packages = [
    "npm:@narumitw/pi-goal",
    "npm:@upstash/context7-pi",
    "npm:@narumitw/pi-btw",
    "npm:pi-antigravity",
    "npm:pi-autoresearch",
    "npm:pi-wakatime"
]
skills_add = []

[windows]
package_managers = ["winget", "scoop"]

# 1. 核心系统工具链 (通过 Winget 安装)
winget_packages = [
    "wez.wezterm",
    "Microsoft.PowerShell",
    "Git.Git",
    "JanDeDobbeleer.OhMyPosh",
    "GitHub.cli",
    "Fastfetch-cli.Fastfetch"
]

# 2. Scoop 软件源与国内镜像加速 (南京大学镜像源 + 社区源)
scoop_buckets = [
    "main = https://mirror.nju.edu.cn/git/scoop-main.git",
    "extras = https://mirror.nju.edu.cn/git/scoop-extras.git",
    "versions = https://mirror.nju.edu.cn/git/scoop-versions.git",
    "nerd-fonts = https://mirror.nju.edu.cn/git/scoop-nerd-fonts.git/",
    "dorado = https://github.com/chawyehsu/dorado"
]

# 3. Scoop 软件包清单 (字体、终端复用器、轻量与主流编辑器)
scoop_packages = [
    "aria2",
    "Maple-Mono-NF-CN",
    "zellij",
    "notepad3",
    "vscode"
]

# 4. 现代 Python 管理器
python_manager = "uv"

# 5. 符号链接配置同步清单
configs = [
    "wezterm",
    "powershell",
    "fastfetch",
    "zellij"
]
