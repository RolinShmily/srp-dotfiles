# manifest.toml - SrP-Dotfiles 跨平台依赖与配置清单

[arch]
package_manager = "pacman"
packages = [
    # Shell 环境
    "zsh", "zsh-autosuggestions", "zsh-syntax-highlighting",
    # CLI 现代增强
    "eza", "zoxide", "fzf", "bat", "fd", "ripgrep", "diff-so-fancy", "github-cli", "lazygit", "jq", "tldr",
    # 语言与运行时
    "nodejs", "npm", "python", "uv",
    # 文件管理 (Yazi 及其预览插件依赖) 与音频录制
    "yazi", "file", "chafa", "imagemagick", "poppler", "ffmpeg", "sox", "7zip", "unarchiver", "perl-image-exiftool", "mediainfo", "zathura", "zathura-pdf-poppler", "miller", "resvg", "xdg-utils", "xclip", "wl-clipboard",
    # 编辑器与编译基础
    "vim", "git", "base-devel", "gcc", "unzip",
    # 终端复用
    "zellij",
    # 监控与信息展示
    "fastfetch", "btop"
]
npm_globals = [
    "@earendil-works/pi-coding-agent",
    "@antfu/ni",
    "live-server"
]
configs = [
    "btop",
    "fastfetch",
    "yazi",
    "zellij",
    "pi"
]
zsh_module = "arch"
pi_extensions = [
    "srp-ask.ts",
    "srp-continue.ts",
    "srp-prompt.ts",
    "srp-providers.ts",
    "srp-theme.ts",
    "srp-vision.ts",
    "srp-voice.ts",
    "srp-web.ts",
    "wsl-screenshot.ts",
    "srp-memory",
    "srp-subagent"
]
pi_packages = [
    "npm:@narumitw/pi-goal",
    "npm:@ff-labs/pi-fff",
    "npm:@upstash/context7-pi",
    "npm:@narumitw/pi-btw",
    "npm:pi-antigravity",
    "npm:pi-autoresearch"
]
skills_add = []

[debian]
package_manager = "apt"
packages = [
    # Shell 环境
    "zsh", "zsh-autosuggestions", "zsh-syntax-highlighting",
    # CLI 现代增强
    "eza", "zoxide", "fzf", "bat", "fd-find", "ripgrep", "gh", "lazygit", "jq", "tealdeer",
    # 语言与运行时
    "nodejs", "python3", "python3-pip", "python3-venv",
    # 编辑器与基础开发
    "vim", "git", "build-essential", "gcc", "unzip",
    # 监控与系统
    "fastfetch", "btop"
]
npm_globals = [
    "@earendil-works/pi-coding-agent",
    "@agegr/pi-web@latest",
    "skills"
]
configs = [
    "btop",
    "fastfetch",
    "pi",
]
zsh_module = "debian"
pi_extensions = [
    "srp-ask.ts",
    "srp-continue.ts",
    "srp-prompt.ts",
    "srp-providers.ts",
    "srp-theme.ts",
    "srp-vision.ts",
    "srp-memory"
]
pi_packages = [
    "npm:pi-web-access",
    "npm:pi-mcp-adapter",
    "npm:pi-subagents",
    "npm:pi-background-tasks",
    "npm:@xjuai/pi-feishu-lark",
    "npm:pi-memory",
    "npm:pi-antigravity",
    "npm:context-mode"
]
skills_add = [
    "mvanhorn/last30days-skill",
    "K-Dense-AI/scientific-agent-skills",
    "https://github.com/WEIFENG2333/VideoCaptioner/",
    "https://github.com/Leonxlnx/taste-skill",
    "tt-a1i/archify",
    "https://github.com/Panniantong/agent-reach"
]

[termux]
package_manager = "pkg"
packages = [
    # Shell 环境
    "zsh",
    # CLI 现代增强
    "eza", "zoxide", "fzf", "bat", "fd", "ripgrep", "diff-so-fancy", "gh", "lazygit", "jq", "tealdeer",
    # 语言与运行时
    "nodejs", "python", "uv",
    # 文件管理 (Yazi)
    "yazi", "file", "chafa", "imagemagick", "poppler", "ffmpeg", "7zip", "unar", "exiftool", "mediainfo", "miller",
    # 基础开发
    "git", "clang", "make", "unzip", "tree-sitter",
    # 终端复用与监控
    "zellij", "fastfetch", "htop", "termux-api"
]
npm_globals = [
    "@earendil-works/pi-coding-agent",
    "@antfu/ni",
    "live-server"
]
configs = [
    "fastfetch",
    "yazi",
    "zellij",
    "pi"
]
zsh_module = "termux"
pi_extensions = [
    "srp-ask.ts",
    "srp-continue.ts",
    "srp-prompt.ts",
    "srp-providers.ts",
    "srp-theme.ts",
    "srp-vision.ts",
    "srp-web.ts",
    "srp-memory",
    "srp-subagent"
]
pi_packages = [
    "npm:@narumitw/pi-goal",
    "npm:@upstash/context7-pi",
    "npm:@narumitw/pi-btw",
    "npm:pi-antigravity",
    "npm:pi-autoresearch"
]
skills_add = []
