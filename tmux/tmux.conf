# Zellij-inspired shortcuts for interactive use. The default Ctrl+b bindings
# and tmux CLI remain intact for tools that address panes by ID.
set -g prefix C-b
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g mouse on
set -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# Ctrl+p, then one key: pane operations (like Zellij's pane mode).
# These bindings are one-shot; Ctrl+p again for another action.
bind-key -n C-p switch-client -T zellij-pane
bind-key -T zellij-pane r split-window -h -c '#{pane_current_path}'
bind-key -T zellij-pane d split-window -v -c '#{pane_current_path}'
bind-key -T zellij-pane n split-window -c '#{pane_current_path}'
# Clear bindings removed from this file so a reload matches a fresh server.
unbind-key -q -T zellij-pane h
unbind-key -q -T zellij-pane f
bind-key -T zellij-pane i select-pane -U
bind-key -T zellij-pane j select-pane -L
bind-key -T zellij-pane k select-pane -D
bind-key -T zellij-pane l select-pane -R
bind-key -T zellij-pane o select-pane -t :.+
bind-key -T zellij-pane x confirm-before -p 'Close pane #P? (y/n)' kill-pane

# Alt i/j/k/l focus panes with no prefix, mirroring Zellij's Alt+hjkl.
bind-key -n M-i select-pane -U
bind-key -n M-j select-pane -L
bind-key -n M-k select-pane -D
bind-key -n M-l select-pane -R
# Alt +/- resize the current pane wider/narrower (Zellij's Alt +/-).
# Horizontal, so it needs the pane to have a movable right/left edge.
bind-key -n M-+ resize-pane -R 3
bind-key -n M-- resize-pane -L 3
# Alt 1-9: jump straight to that tab (tmux window), no prefix. These live in
# the root table while tmux's own M-1..M-5 preset layouts live in the prefix
# table, so C-b M-1 still selects a layout and nothing is shadowed.
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

# Ctrl+w, then one key: tab (tmux window) operations (same key as Zellij's tab mode).
unbind-key -q -T root C-t
bind-key -n C-w switch-client -T zellij-tab
bind-key -T zellij-tab n new-window -c '#{pane_current_path}'
unbind-key -q -T zellij-tab h
unbind-key -q -T zellij-tab i
unbind-key -q -T zellij-tab l
bind-key -T zellij-tab j previous-window
bind-key -T zellij-tab k next-window
# -d keeps the focus on the window being moved, matching Zellij's MoveTab.
bind-key -T zellij-tab J swap-window -d -t :-1
bind-key -T zellij-tab L swap-window -d -t :+1
bind-key -T zellij-tab x confirm-before -p 'Close window #I? (y/n)' kill-window
bind-key -T zellij-tab 1 select-window -t :=1
bind-key -T zellij-tab 2 select-window -t :=2
bind-key -T zellij-tab 3 select-window -t :=3
bind-key -T zellij-tab 4 select-window -t :=4
bind-key -T zellij-tab 5 select-window -t :=5
bind-key -T zellij-tab 6 select-window -t :=6
bind-key -T zellij-tab 7 select-window -t :=7
bind-key -T zellij-tab 8 select-window -t :=8
bind-key -T zellij-tab 9 select-window -t :=9

# Ctrl+o enters the Zellij-style session table: s opens the session list (the
# same key Zellij uses, Ctrl+o s), n creates a session (n = new, matching the
# pane/tab tables), d detaches the client.
unbind-key -q -T zellij-session w
bind-key -n C-o switch-client -T zellij-session
bind-key -T zellij-session s choose-tree -s
bind-key -T zellij-session n new-session -c '#{pane_current_path}'
bind-key -T zellij-session d detach-client

# Copy/scroll mode: use the same ijkl directions without removing arrow keys.
unbind-key -q -T copy-mode-vi h
bind-key -T copy-mode-vi i send-keys -X cursor-up
bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi l send-keys -X cursor-right
