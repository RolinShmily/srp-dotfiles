# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[manager]
ratio = [1, 3, 2]
sort_by = "alphabetical"
sort_sensitive = true
sort_reverse = true
sort_dir_first = true
linemode = "size_and_mtime"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 5000
max_height = 5000
# cache_dir = ""
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
	{ run = '${EDITOR:-vim} %s', block = true, desc = "$EDITOR", for = "unix" },
	{ run = 'code %s', orphan = true, desc = "VS Code", for = "unix" },
	{ run = 'code %*', orphan = true, desc = "VS Code", for = "windows" },
	{ run = 'notepad %*', block = true, desc = "Notepad", for = "windows" },
]
open = [
	{ run = 'for f in %s; do /mnt/c/Windows/System32/rundll32.exe url.dll,FileProtocolHandler "$(wslpath -w "$f")"; done', orphan = true, desc = "Open in Windows", for = "unix" },
	{ run = 'start "" "%1"', orphan = true, desc = "Open in Windows", for = "windows" },
]
reveal = [
	{ run = 'explorer.exe /select,"$(wslpath -w "%s1")"', orphan = true, desc = "Reveal in Windows", for = "unix" },
	{ run = 'explorer /select,"%1"', orphan = true, desc = "Reveal in Explorer", for = "windows" },
]
extract = [
	{ run = 'unar %s1', desc = "Extract here", for = "unix" },
	{ run = '7z x %1', desc = "Extract here", for = "windows" },
]
play = [
	{ run = 'for f in %s; do /mnt/c/Windows/System32/rundll32.exe url.dll,FileProtocolHandler "$(wslpath -w "$f")"; done', orphan = true, desc = "Play in Windows", for = "unix" },
	{ run = 'start "" "%1"', orphan = true, desc = "Play in Windows", for = "windows" },
]
zathura = [{ run = 'zathura %s1', orphan = true, for = "unix" }]
rootbrowse = [{ run = 'rootbrowse %s1', orphan = true, for = "unix" }]

[open]
rules = [
	{ url = "*/", use = ["edit", "open", "reveal"] },

	{ mime = "text/*", use = ["edit", "reveal"] },
	{ mime = "image/*", use = ["open", "reveal"] },
	{ mime = "video/*", use = ["open", "reveal"] },
	{ mime = "audio/*", use = ["open", "reveal"] },
	{ mime = "inode/x-empty", use = ["edit", "reveal"] },

	{ mime = "application/json", use = ["edit", "reveal"] },
	{ mime = "application/pdf", use = ["zathura", "reveal"] },
	{ mime = "*/javascript", use = ["edit", "reveal"] },
	{ url = "*.root", use = ["rootbrowse"] },

	{ url = "*.zip", use = ["extract", "reveal"] },
	# { mime = "application/gzip",            use = [ "extract", "reveal" ] },
	# { mime = "application/x-tar",           use = [ "extract", "reveal" ] },
	# { mime = "application/x-bzip",          use = [ "extract", "reveal" ] },
	# { mime = "application/x-bzip2",         use = [ "extract", "reveal" ] },
	# { mime = "application/x-7z-compressed", use = [ "extract", "reveal" ] },
	# { mime = "application/x-rar",           use = [ "extract", "reveal" ] },
	# { mime = "application/xz",              use = [ "extract", "reveal" ] },

	{ mime = "*", use = ["open", "reveal"] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
prepend_previewers = [{ mime = "text/csv", run = "miller" }]
previewers = [
	{ url = "*/", run = "folder", sync = true },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "*/xml", run = "code" },
	{ mime = "*/javascript", run = "code" },
	{ mime = "*/x-wine-extension-ini", run = "code" },
	# JSON
	{ mime = "application/json", run = "json" },
	# Image
	{ mime = "image/vnd.djvu", run = "noop" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/zip", run = "archive" },
	{ mime = "application/gzip", run = "archive" },
	{ mime = "application/x-tar", run = "archive" },
	{ mime = "application/x-bzip", run = "archive" },
	{ mime = "application/x-bzip2", run = "archive" },
	{ mime = "application/x-7z-compressed", run = "archive" },
	{ mime = "application/x-rar", run = "archive" },
	{ mime = "application/xz", run = "archive" },
]

[input]
# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# trash
trash_title = "Move {n} selected file{s} to trash? (y/N)"
trash_origin = "top-center"
trash_offset = [0, 2, 50, 3]

# delete
delete_title = "Delete {n} selected file{s} permanently? (y/N)"
delete_origin = "top-center"
delete_offset = [0, 2, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

# overwrite
overwrite_title = "Overwrite an existing file? (y/N)"
overwrite_origin = "top-center"
overwrite_offset = [0, 2, 50, 3]

# quit
quit_title = "{n} task{s} running, sure to quit? (y/N)"
quit_origin = "top-center"
quit_offset = [0, 2, 50, 3]

[select]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[log]
enabled = false